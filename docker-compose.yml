# docker-compose.yml
services:
  redis-dev:
    image: redis:7-alpine
    container_name: job-scheduler-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-dev:
    image: postgres:15-alpine
    container_name: job-scheduler-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JohnUghiovhe.10
      POSTGRES_DB: job_scheduler_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data: